kind = "web"
previewPath = "/"
title = "KWASU NACOS Signup"
description = "A KWASU NACOS student complaint portal signup page that submits a student email to the real backend and displays credentials returned by the backend."
version = "1.0.0"
id = "artifacts/kwasu-nacos-signup"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21762

[services.development]
run = "pnpm --filter @workspace/kwasu-nacos-signup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kwasu-nacos-signup", "run", "build" ]
serve = "static"
publicDir = "artifacts/kwasu-nacos-signup/out"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21762"
BASE_PATH = "/"
